<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해외연수 실시간 정보 공유 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' } } } }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 80px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyAtkGBdvsddzMoUhv-JSahn2JuipzFoh8M",
      authDomain: "global-training-2026.firebaseapp.com",
      projectId: "global-training-2026",
      storageBucket: "global-training-2026.firebasestorage.app",
      messagingSenderId: "597871254165",
      appId: "1:597871254165:web:df32675f6f8c10292d199c"
    };

    let db = null;
    let storage = null;
    let isFirebaseConfigured = false;

    try {
      if (!firebase.apps.length && firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        storage = firebase.storage();
        isFirebaseConfigured = true;
      }
    } catch (e) { console.warn("Firebase Init Error", e); }

    const Icon = ({ name, size = 20, className = "" }) => {
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block' }} class={className}></i>;
    };

    const renderTextWithLinks = (text) => {
      if (!text) return null;
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const parts = text.split(urlRegex);
      return parts.map((part, i) =>
        urlRegex.test(part) ? (
          <a key={i} href={part} target="_blank" rel="noopener noreferrer" className="text-sky-600 font-bold underline break-all hover:text-sky-800 transition-colors">
            {part}
          </a>
        ) : ( part )
      );
    };

    const getDayOfWeek = (dateStr) => {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const d = new Date(dateStr);
      return isNaN(d) ? '' : `(${days[d.getDay()]})`;
    };

    const forceDownload = async (fileUrl, fileName) => {
      try {
        const response = await fetch(fileUrl);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = fileName || 'downloaded_image.jpg';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(blobUrl);
      } catch (err) { window.open(fileUrl, '_blank'); }
    };

    function GlobalTrainingApp() {
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('training_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [isAdminLogin, setIsAdminLogin] = useState(false);
      const [activeTab, setActiveTab] = useState('schedule');
      const [modalState, setModalState] = useState({ type: null, data: null });
      const [isUploading, setIsUploading] = useState(false);
      const [selectedFiles, setSelectedFiles] = useState([]);
      const [schedules, setSchedules] = useState([]);
      const [notices, setNotices] = useState([]);
      const [boards, setBoards] = useState([]);
      const [photos, setPhotos] = useState([]);
      const [reviews, setReviews] = useState([]);

      useEffect(() => {
        if (isFirebaseConfigured && db) {
          db.collection('schedules').orderBy('date', 'asc').orderBy('startTime', 'asc').onSnapshot(s => setSchedules(s.docs.map(d => ({ id: d.id, ...d.data() }))));
          db.collection('notices').orderBy('createdAt', 'desc').onSnapshot(s => setNotices(s.docs.map(d => ({ id: d.id, ...d.data() }))));
          db.collection('boards').orderBy('createdAt', 'desc').onSnapshot(s => setBoards(s.docs.map(d => ({ id: d.id, ...d.data() }))));
          db.collection('photos').orderBy('createdAt', 'desc').onSnapshot(s => setPhotos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
          db.collection('reviews').orderBy('createdAt', 'desc').onSnapshot(s => setReviews(s.docs.map(d => ({ id: d.id, ...d.data() }))));
        }
      }, [isFirebaseConfigured]);

      const uploadPhotos = async (files, caption) => {
        if (!files || files.length === 0) return;
        setIsUploading(true);
        try {
          await Promise.all(Array.from(files).map(async (file) => {
            const timeStamp = Date.now();
            const compressed = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.readAsDataURL(file);
              reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                  const canvas = document.createElement('canvas');
                  const scale = Math.min(1200 / img.width, 1200 / img.height, 1);
                  canvas.width = img.width * scale; canvas.height = img.height * scale;
                  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                  canvas.toBlob((b) => resolve(new File([b], file.name, { type: 'image/jpeg' })), 'image/jpeg', 0.8);
                };
              };
            });
            const origPath = `photos/orig_${timeStamp}_${file.name}`;
            const thumbPath = `photos/thumb_${timeStamp}_${file.name}`;
            const [origSnap, thumbSnap] = await Promise.all([
              storage.ref(origPath).put(file),
              storage.ref(thumbPath).put(compressed)
            ]);
            await db.collection('photos').add({ 
              url: await thumbSnap.ref.getDownloadURL(), 
              originalUrl: await origSnap.ref.getDownloadURL(), 
              origPath, thumbPath, caption, author: user.name, createdAt: new Date().toISOString() 
            });
          }));
          alert('사진 업로드 완료.');
        } catch(err) { alert('업로드 오류: ' + err.message); }
        setIsUploading(false); setSelectedFiles([]); setModalState({ type: null });
      };

      // [핵심 로직] 사진 연동 삭제
      const deletePhoto = async (id) => {
        if (!confirm('삭제하겠는가?')) return;
        try {
          const docRef = db.collection('photos').doc(id);
          const doc = await docRef.get();
          if (doc.exists) {
            const { origPath, thumbPath } = doc.data();
            if (origPath) await storage.ref(origPath).delete();
            if (thumbPath) await storage.ref(thumbPath).delete();
          }
          await docRef.delete();
        } catch (e) { alert('파일 삭제 중 오류 발생 (이미 삭제되었을 수 있음): ' + e.message); }
      };

      // [핵심 로직] 공지사항 파일 연동 삭제
      const deleteNotice = async (id) => {
        if (!confirm('삭제하겠는가?')) return;
        try {
          const docRef = db.collection('notices').doc(id);
          const doc = await docRef.get();
          if (doc.exists && doc.data().storagePath) {
            await storage.ref(doc.data().storagePath).delete();
          }
          await docRef.delete();
        } catch (e) { alert('공지사항 삭제 오류: ' + e.message); }
      };

      // ... (기타 함수 생략)
      
      return (
        // UI 부분은 동일하므로 생략 (기존 index.html 구조 유지)
        <div className="min-h-screen bg-slate-100 flex flex-col pb-20">
          {/* ... */}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<GlobalTrainingApp />);
  </script>
</body>
</html>
