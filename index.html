<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해외연수 실시간 정보 공유 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' } } } }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 80px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyAtkGBdvsddzMoUhv-JSahn2JuipzFoh8M",
      authDomain: "global-training-2026.firebaseapp.com",
      projectId: "global-training-2026",
      storageBucket: "global-training-2026.firebasestorage.app",
      messagingSenderId: "597871254165",
      appId: "1:597871254165:web:df32675f6f8c10292d199c"
    };

    let db = null;
    let storage = null;
    let isFirebaseConfigured = false;

    try {
      if (!firebase.apps.length && firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        storage = firebase.storage();
        isFirebaseConfigured = true;
      }
    } catch (e) { console.warn("Firebase Init Error", e); }

    const Icon = ({ name, size = 20, className = "" }) => {
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block' }} class={className}></i>;
    };

    const renderTextWithLinks = (text) => {
      if (!text) return null;
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const parts = text.split(urlRegex);
      return parts.map((part, i) =>
        urlRegex.test(part) ? (
          <a key={i} href={part} target="_blank" rel="noopener noreferrer" className="text-sky-600 font-bold underline break-all hover:text-sky-800 transition-colors">
            {part}
          </a>
        ) : ( part )
      );
    };

    const getDayOfWeek = (dateStr) => {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const d = new Date(dateStr);
      return isNaN(d) ? '' : `(${days[d.getDay()]})`;
    };

    // 모바일 갤러리 저장용 네이티브 API (Web Share API) 연동 강제 다운로드 로직
    const forceDownload = async (fileUrl, fileName) => {
      try {
        const response = await fetch(fileUrl);
        const blob = await response.blob();
        const fileNameStr = fileName || `training_photo_${Date.now()}.jpg`;
        const file = new File([blob], fileNameStr, { type: blob.type || 'image/jpeg' });

        // 모바일 환경에서 갤러리 저장을 지원하는 네이티브 공유 API 우선 실행
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: '사진 저장'
            });
            return; // 갤러리에 저장 완료 시 함수 종료
          } catch (shareErr) {
            console.log('공유 취소됨');
            return; 
          }
        }

        // PC 환경이거나 공유 API를 지원하지 않을 경우 기존 브라우저 강제 다운로드 실행
        const blobUrl = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = fileNameStr;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(blobUrl);
      } catch (err) {
        // 보안/CORS 문제로 가져오지 못한 경우 새 창 열기
        window.open(fileUrl, '_blank');
      }
    };

    function GlobalTrainingApp() {
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('training_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [isAdminLogin, setIsAdminLogin] = useState(false);
      const [activeTab, setActiveTab] = useState('schedule');
      const [modalState, setModalState] = useState({ type: null, data: null });
      const [isUploading, setIsUploading] = useState(false);
      const [selectedFiles, setSelectedFiles] = useState([]);
      const [schedules, setSchedules] = useState([]);
      const [notices, setNotices] = useState([]);
      const [boards, setBoards] = useState([]);
      const [photos, setPhotos] = useState([]);
      const [reviews, setReviews] = useState([]);

      useEffect(() => {
        if (isFirebaseConfigured && db) {
          db.collection('schedules').orderBy('date', 'asc').orderBy('startTime', 'asc').onSnapshot(s => setSchedules(s.docs.map(d => ({ id: d.id, ...d.data() }))));
          db.collection('notices').orderBy('createdAt', 'desc').onSnapshot(s => setNotices(s.docs.map(d => ({ id: d.id, ...d.data() }))));
          db.collection('boards').orderBy('createdAt', 'desc').onSnapshot(s => setBoards(s.docs.map(d => ({ id: d.id, ...d.data() }))));
          db.collection('photos').orderBy('createdAt', 'desc').onSnapshot(s => setPhotos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
          db.collection('reviews').orderBy('createdAt', 'desc').onSnapshot(s => setReviews(s.docs.map(d => ({ id: d.id, ...d.data() }))));
        }
      }, [isFirebaseConfigured]);

      const uploadPhotos = async (files, caption) => {
        if (!files || files.length === 0) return;
        setIsUploading(true);
        try {
          await Promise.all(Array.from(files).map(async (file) => {
            const timeStamp = Date.now();
            const compressed = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.readAsDataURL(file);
              reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                  const canvas = document.createElement('canvas');
                  const scale = Math.min(1200 / img.width, 1200 / img.height, 1);
                  canvas.width = img.width * scale; canvas.height = img.height * scale;
                  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                  canvas.toBlob((b) => resolve(new File([b], file.name, { type: 'image/jpeg' })), 'image/jpeg', 0.8);
                };
              };
            });
            const origPath = `photos/orig_${timeStamp}_${file.name}`;
            const thumbPath = `photos/thumb_${timeStamp}_${file.name}`;
            const [origSnap, thumbSnap] = await Promise.all([
              storage.ref(origPath).put(file),
              storage.ref(thumbPath).put(compressed)
            ]);
            await db.collection('photos').add({ 
              url: await thumbSnap.ref.getDownloadURL(), 
              originalUrl: await origSnap.ref.getDownloadURL(), 
              origPath, thumbPath, caption, author: user.name, createdAt: new Date().toISOString() 
            });
          }));
          alert('사진 업로드 완료.');
        } catch(err) { alert('업로드 오류: ' + err.message); }
        setIsUploading(false); setSelectedFiles([]); setModalState({ type: null });
      };

      const deletePhoto = async (id) => {
        if (!confirm('삭제하겠는가?')) return;
        try {
          const docRef = db.collection('photos').doc(id);
          const doc = await docRef.get();
          if (doc.exists) {
            const { origPath, thumbPath } = doc.data();
            if (origPath) await storage.ref(origPath).delete();
            if (thumbPath) await storage.ref(thumbPath).delete();
          }
          await docRef.delete();
        } catch (e) { alert('파일 삭제 중 오류 발생 (이미 삭제되었을 수 있음): ' + e.message); }
      };

      const deleteNotice = async (id) => {
        if (!confirm('삭제하겠는가?')) return;
        try {
          const docRef = db.collection('notices').doc(id);
          const doc = await docRef.get();
          if (doc.exists && doc.data().storagePath) {
            await storage.ref(doc.data().storagePath).delete();
          }
          await docRef.delete();
        } catch (e) { alert('공지사항 삭제 오류: ' + e.message); }
      };

      const checkFileSize = (file) => {
        const maxSize = 5 * 1024 * 1024; 
        if (file.size > maxSize) {
          alert(`파일 용량이 너무 크다. (현재: ${(file.size / 1024 / 1024).toFixed(1)}MB)\n5MB 이하의 파일만 업로드할 수 있다.`);
          return false;
        }
        return true;
      };

      const addSchedule = (data) => { if (isFirebaseConfigured && db) db.collection('schedules').add({ ...data, createdAt: new Date().toISOString() }); };
      const editSchedule = (id, data) => { if (isFirebaseConfigured && db) db.collection('schedules').doc(id).update(data); };
      const deleteSchedule = (id) => { if (confirm('삭제하겠는가?') && isFirebaseConfigured && db) db.collection('schedules').doc(id).delete(); };

      const submitNotice = async (e) => {
        e.preventDefault();
        const form = e.target;
        const title = form.title.value;
        const content = form.content.value;
        const file = form.noticeFile?.files[0];
        
        let fileUrl = '';
        let fileName = '';
        let storagePath = '';

        if (file) {
          if (!checkFileSize(file)) return; 
          
          setIsUploading(true);
          fileName = file.name;
          if (isFirebaseConfigured && storage) {
            storagePath = `notices/${Date.now()}_${file.name}`;
            const fileRef = storage.ref(storagePath);
            try {
              const snapshot = await fileRef.put(file);
              fileUrl = await snapshot.ref.getDownloadURL();
            } catch (err) {
              alert('스토리지 업로드 거부됨. 파이어베이스 Storage 규칙 및 요금제 상태를 확인하라.\n에러 내용: ' + err.message);
              setIsUploading(false);
              return;
            }
          } else {
             alert('서버 스토리지(Storage)가 초기화되지 않았다. 파이어베이스 설정을 확인하라.');
             setIsUploading(false);
             return;
          }
        }

        const payload = { title, content, fileName, fileUrl, storagePath, author: user.name, createdAt: new Date().toISOString() };
        if (isFirebaseConfigured && db) await db.collection('notices').add(payload);
        
        setIsUploading(false);
        setModalState({ type: null });
      };

      const addBoard = (content) => { if (isFirebaseConfigured && db) db.collection('boards').add({ content, author: user.name, authorId: user.name, createdAt: new Date().toISOString(), comments: [] }); };
      const editBoard = (id, content) => { if (isFirebaseConfigured && db) db.collection('boards').doc(id).update({ content }); };
      const deleteBoard = (id) => { if (confirm('삭제하겠는가?') && isFirebaseConfigured && db) db.collection('boards').doc(id).delete(); };
      
      const addComment = (boardId, commentText) => {
        if (!commentText.trim() || !isFirebaseConfigured || !db) return;
        const newComment = { id: 'c_' + Date.now(), author: user.name, text: commentText, createdAt: new Date().toISOString() };
        const boardRef = db.collection('boards').doc(boardId);
        db.runTransaction(transaction => transaction.get(boardRef).then(doc => {
          if (doc.exists) transaction.update(boardRef, { comments: [...(doc.data().comments || []), newComment] });
        }));
      };
      const deleteComment = (boardId, commentId) => {
        if (!isFirebaseConfigured || !db) return;
        const boardRef = db.collection('boards').doc(boardId);
        db.runTransaction(transaction => transaction.get(boardRef).then(doc => {
          if (doc.exists) transaction.update(boardRef, { comments: (doc.data().comments || []).filter(c => c.id !== commentId) });
        }));
      };

      const addReview = (content) => { if (isFirebaseConfigured && db) db.collection('reviews').add({ content, author: user.name, authorId: user.name, createdAt: new Date().toISOString() }); };
      const editReview = (id, content) => { if (isFirebaseConfigured && db) db.collection('reviews').doc(id).update({ content }); };
      const deleteReview = (id) => { if (confirm('삭제하겠는가?') && isFirebaseConfigured && db) db.collection('reviews').doc(id).delete(); };

      const handleExcelUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary' });
            const wsName = wb.SheetNames[0];
            const ws = wb.Sheets[wsName];
            const data = XLSX.utils.sheet_to_json(ws, { raw: false, dateNF: 'yyyy-mm-dd' });

            if (data.length === 0) {
              alert('엑셀 파일에서 데이터를 읽을 수 없다. 빈 파일이거나 양식이 잘못되었는지 확인하라.');
              return;
            }

            const parsedSchedules = data.map((row) => {
              const dateKey = Object.keys(row).find(k => k.includes('날짜') || k.toLowerCase().includes('date')) || Object.keys(row)[0];
              const timeKey = Object.keys(row).find(k => k.includes('시간') || k.toLowerCase().includes('time') || k.includes('시작')) || Object.keys(row)[1];
              const endTimeKey = Object.keys(row).find(k => k.includes('종료')) || null;
              const locationKey = Object.keys(row).find(k => k.includes('장소') || k.toLowerCase().includes('location')) || Object.keys(row)[2];
              const contentKey = Object.keys(row).find(k => k.includes('활동') || k.includes('내용')) || Object.keys(row)[3];
              
              let rawDate = row[dateKey] ? String(row[dateKey]).trim() : '2026-09-10';
              rawDate = rawDate.replace(/\./g, '-').replace(/\//g, '-').replace(/[^\d-]/g, ''); 
              const dateParts = rawDate.split('-');
              if(dateParts.length === 3) {
                  const y = dateParts[0].length === 2 ? '20' + dateParts[0] : dateParts[0];
                  rawDate = `${y}-${dateParts[1].padStart(2, '0')}-${dateParts[2].padStart(2, '0')}`;
              }
              const finalDateStr = rawDate + getDayOfWeek(rawDate);

              let startTime = row[timeKey] ? String(row[timeKey]).trim() : '09:00';
              let endTime = endTimeKey && row[endTimeKey] ? String(row[endTimeKey]).trim() : '';
              if (!endTime && (startTime.includes('~') || startTime.includes('-'))) {
                const parts = startTime.includes('~') ? startTime.split('~') : startTime.split('-');
                if(parts.length >= 2) { startTime = parts[0].trim(); endTime = parts[1].trim(); }
              }

              return { date: finalDateStr, startTime, endTime, location: row[locationKey] ? String(row[locationKey]).trim() : '장소 미정', content: row[contentKey] ? String(row[contentKey]) : '일정 내용 없음', color: '#1e293b', createdAt: new Date().toISOString() };
            });
            
            if (isFirebaseConfigured && db) {
              const batch = db.batch();
              parsedSchedules.forEach(item => { batch.set(db.collection('schedules').doc(), item); });
              batch.commit()
                .then(() => alert(`성공적으로 총 ${parsedSchedules.length}건의 일정을 추가했다.`))
                .catch(err => alert('데이터베이스 저장 중 오류가 발생했다: ' + err.message));
            }
          } catch (err) { alert('엑셀 파일 파싱 오류: 데이터 형식을 다시 확인하라. (' + err.message + ')'); }
        };
        reader.readAsBinaryString(file);
      };

      const copyInviteLink = () => {
        const shareUrl = window.location.href.split('?')[0].split('#')[0]; 
        navigator.clipboard.writeText(shareUrl)
          .then(() => alert(`접속 링크 복사가 완료되었다!\n\n복사된 주소: ${shareUrl}`))
          .catch(() => alert('링크 복사에 실패했다.'));
      };

      const sortedScheduleDates = Object.keys(schedules.reduce((acc, curr) => {
        const d = (curr.date || '').substring(0, 10);
        if (!acc[d]) acc[d] = [];
        acc[d].push(curr);
        return acc;
      }, {})).sort();

      const groupedSchedules = schedules.reduce((acc, curr) => {
        const d = (curr.date || '').substring(0, 10);
        if (!acc[d]) acc[d] = [];
        acc[d].push(curr);
        return acc;
      }, {});
      Object.keys(groupedSchedules).forEach(k => groupedSchedules[k].sort((a,b) => a.startTime.localeCompare(b.startTime)));

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-sky-500 via-blue-600 to-sky-800">
            <div className="w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
              <div className="text-center space-y-2">
                <div className="inline-flex p-3 bg-sky-100 text-sky-600 rounded-full mb-2"><Icon name="plane" size={32} /></div>
                <h1 className="text-2xl font-extrabold text-slate-800 tracking-tight">2026 Global Welfare Overseas Training</h1>
              </div>
              <form onSubmit={(e) => {
                e.preventDefault();
                const name = e.target.name.value.trim();
                const pw = e.target.pw.value.trim();
                if(!name || !pw) { alert('입력하라.'); return; }
                let u = (isAdminLogin || name === 'admin818') ? { name: 'admin818', role: 'admin', isAdmin: true } : { name, role: 'user', isAdmin: false };
                if(u.isAdmin && pw !== '1234') { alert('비밀번호 오류'); return; }
                setUser(u); localStorage.setItem('training_user', JSON.stringify(u));
              }} className="space-y-4">
                <div className="flex bg-slate-100 p-1 rounded-xl mb-4">
                  <button type="button" className={`flex-1 py-2 text-sm font-semibold rounded-lg ${!isAdminLogin?'bg-white text-sky-600 shadow-sm':'text-slate-500'}`} onClick={()=>setIsAdminLogin(false)}>참여자</button>
                  <button type="button" className={`flex-1 py-2 text-sm font-semibold rounded-lg ${isAdminLogin?'bg-white text-sky-600 shadow-sm':'text-slate-500'}`} onClick={()=>setIsAdminLogin(true)}>관리자</button>
                </div>
                <input name="name" required placeholder={isAdminLogin?'관리자 ID':'이름'} className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" />
                <input name="pw" type="password" required placeholder="비밀번호" className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" />
                <button type="submit" className="w-full py-3.5 bg-sky-500 text-white font-bold rounded-xl shadow-lg text-sm">접속하기</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col pb-20">
          <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-emerald-400 flex items-center justify-center text-white shadow-md"><Icon name="compass" size={22} /></div>
                <div>
                  <h1 className="text-base font-bold text-slate-800">2026 Global Welfare Overseas Training</h1>
                  <span className="text-xs text-slate-500">({user.isAdmin ? '관리자' : '참여자'} 접속 중)</span>
                </div>
              </div>
              <div className="flex space-x-2">
                {user.isAdmin && <button onClick={copyInviteLink} className="p-2 text-sky-600 hover:bg-sky-50 rounded-lg"><Icon name="share-2" size={20} /></button>}
                <button onClick={() => { setUser(null); localStorage.removeItem('training_user'); }} className="p-2 text-slate-400 hover:text-rose-600 rounded-lg"><Icon name="log-out" size={20} /></button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-6">
            {activeTab === 'schedule' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Icon name="calendar" size={22} className="text-sky-500" /> 연수 일정</h2>
                  {user.isAdmin && (
                    <div className="flex space-x-2">
                      <label className="cursor-pointer px-3 py-2 bg-emerald-500 text-white text-xs font-bold rounded-xl flex items-center gap-1.5">
                        <Icon name="file-spreadsheet" size={16} />엑셀 업로드<input type="file" accept=".xlsx, .csv" onChange={handleExcelUpload} className="hidden" />
                      </label>
                      <button onClick={() => setModalState({ type: 'add_schedule' })} className="px-3 py-2 bg-sky-500 text-white text-xs font-bold rounded-xl flex items-center gap-1"><Icon name="plus" size={16} />추가</button>
                    </div>
                  )}
                </div>
                <div className="space-y-6">
                  {sortedScheduleDates.map(dateKey => (
                    <div key={dateKey} className="space-y-3">
                      <div className="sticky top-16 z-20 bg-slate-100 py-2 font-extrabold text-slate-700 border-b-2 border-slate-200">
                        {dateKey}{getDayOfWeek(dateKey)}
                      </div>
                      <div className="space-y-3 pl-2 sm:pl-4 border-l-2 border-slate-200 ml-2">
                        {groupedSchedules[dateKey].map((item) => (
                          <div key={item.id} className="bg-white rounded-2xl p-4 border shadow-sm flex flex-col sm:flex-row justify-between gap-4">
                            <div className="flex space-x-4">
                              <div className="px-3 py-2 bg-sky-50 text-sky-600 rounded-xl text-center min-w-[85px] flex flex-col justify-center">
                                <p className="text-base font-extrabold">{item.startTime}</p>
                                {item.endTime && <p className="text-xs font-medium text-slate-500 mt-0.5">~ {item.endTime}</p>}
                              </div>
                              <div>
                                <div className="flex items-center text-xs font-semibold text-emerald-600 mb-1"><Icon name="map-pin" size={14} className="mr-1" />{item.location}</div>
                                <h3 className="text-base font-bold whitespace-pre-line" style={{ color: item.color || '#1e293b' }}>{item.content}</h3>
                              </div>
                            </div>
                            {user.isAdmin && (
                              <div className="flex space-x-2 self-end sm:self-center bg-white rounded-lg p-1 mt-2 sm:mt-0">
                                <button onClick={() => setModalState({ type: 'edit_schedule', data: item })} className="p-1.5 text-slate-400 hover:text-sky-500"><Icon name="edit" size={16} /></button>
                                <button onClick={() => deleteSchedule(item.id)} className="p-1.5 text-slate-400 hover:text-rose-500"><Icon name="trash-2" size={16} /></button>
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'notice' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Icon name="bell" size={22} className="text-sky-500" /> 공지사항</h2>
                  <button onClick={() => setModalState({ type: 'add_notice' })} className="px-3 py-2 bg-sky-500 text-white text-xs font-bold rounded-xl flex items-center gap-1"><Icon name="plus" size={16} />작성</button>
                </div>
                <div className="space-y-3">
                  {notices.map((n) => (
                    <div key={n.id} className="bg-white rounded-2xl p-5 border shadow-sm space-y-3">
                      <div className="flex justify-between">
                        <div>
                          <h3 className="text-lg font-bold text-slate-800">{n.title}</h3>
                          <p className="text-xs text-slate-400 mt-0.5">{n.author} • {new Date(n.createdAt).toLocaleDateString()}</p>
                        </div>
                        {(user.isAdmin || user.name === n.author) && <button onClick={() => deleteNotice(n.id)} className="text-slate-300 hover:text-rose-500 p-1"><Icon name="trash-2" size={18} /></button>}
                      </div>
                      <p className="text-sm text-slate-600 whitespace-pre-line">{renderTextWithLinks(n.content)}</p>
                      {n.fileName && <button onClick={() => forceDownload(n.fileUrl, n.fileName)} className="inline-flex items-center px-3 py-2 bg-slate-50 border rounded-xl text-xs font-medium text-slate-700 space-x-2"><Icon name="download" size={14} /><span>{n.fileName} 다운로드</span></button>}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'board' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Icon name="message-square" size={22} className="text-sky-500" /> 자유게시판</h2>
                  <button onClick={() => setModalState({ type: 'add_board' })} className="px-3 py-2 bg-sky-500 text-white text-xs font-bold rounded-xl flex items-center gap-1"><Icon name="edit-3" size={16} />글쓰기</button>
                </div>
                <div className="space-y-4">
                  {boards.map((b) => (
                    <div key={b.id} className="bg-white rounded-2xl p-5 border shadow-sm space-y-4">
                      <div className="flex justify-between items-start">
                        <div>
                          <p className="text-xs font-bold text-slate-800">{b.author}</p>
                          <p className="text-[10px] text-slate-400 mt-0.5">{new Date(b.createdAt).toLocaleDateString()}</p>
                        </div>
                        {(user.isAdmin || user.name === b.author) && (
                          <div className="flex space-x-1">
                            <button onClick={() => setModalState({ type: 'edit_board', data: b })} className="text-slate-300 hover:text-sky-500 p-1"><Icon name="edit" size={16} /></button>
                            <button onClick={() => deleteBoard(b.id)} className="text-slate-300 hover:text-rose-500 p-1"><Icon name="trash-2" size={16} /></button>
                          </div>
                        )}
                      </div>
                      <p className="text-sm text-slate-700 whitespace-pre-line">{renderTextWithLinks(b.content)}</p>
                      <div className="pt-3 border-t border-slate-100 space-y-3">
                        <p className="text-xs font-bold text-slate-500 flex items-center gap-1"><Icon name="message-circle" size={14} /> 댓글 {b.comments?.length || 0}개</p>
                        <div className="space-y-2">
                          {(b.comments || []).map((c) => (
                            <div key={c.id} className="bg-slate-50 rounded-xl p-3 text-xs flex justify-between">
                              <div><span className="font-bold text-slate-700 mr-2">{c.author}</span><span className="text-slate-600">{renderTextWithLinks(c.text)}</span></div>
                              {(user.isAdmin || user.name === c.author) && <button onClick={() => deleteComment(b.id, c.id)} className="text-slate-300 hover:text-rose-500 ml-2"><Icon name="x" size={14} /></button>}
                            </div>
                          ))}
                        </div>
                        <div className="flex space-x-2">
                          <input type="text" placeholder="댓글..." id={`cmd-${b.id}`} onKeyDown={(e) => { if (e.key === 'Enter') { addComment(b.id, e.target.value); e.target.value=''; } }} className="flex-1 px-3 py-2 bg-slate-100 rounded-xl text-xs" />
                          <button onClick={() => { const el = document.getElementById(`cmd-${b.id}`); addComment(b.id, el.value); el.value=''; }} className="px-3 py-2 bg-sky-500 text-white font-bold rounded-xl text-xs">등록</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'gallery' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Icon name="image" size={22} className="text-sky-500" /> 사진</h2>
                  <button onClick={() => setModalState({ type: 'upload_photo' })} className="px-3 py-2 bg-sky-500 text-white text-xs font-bold rounded-xl"><Icon name="camera" size={16} /> 올리기</button>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  {photos.map((p) => (
                    <div key={p.id} className="bg-white rounded-2xl overflow-hidden border shadow-sm flex flex-col relative group">
                      <div className="aspect-square bg-slate-100 cursor-pointer" onClick={() => setLightboxImg(p)}>
                        <img src={p.url} className="w-full h-full object-cover" />
                      </div>
                      <div className="p-3 flex-1 flex flex-col justify-between">
                        <p className="text-xs font-medium text-slate-700 line-clamp-2">{renderTextWithLinks(p.caption)}</p>
                        <div className="flex justify-between items-center pt-2 mt-2 border-t border-slate-50">
                          <span className="text-[11px] text-slate-400">{p.author}</span>
                          <div className="flex space-x-3">
                            {/* 퀵 다운로드 버튼 추가 */}
                            <button onClick={(e) => { e.stopPropagation(); forceDownload(p.originalUrl || p.url, `photo_${Date.now()}.jpg`); }} className="text-sky-500 hover:text-sky-700">
                              <Icon name="download" size={16} />
                            </button>
                            {(user.isAdmin || user.name === p.author) && (
                              <button onClick={() => deletePhoto(p.id)} className="text-slate-300 hover:text-rose-500">
                                <Icon name="trash-2" size={16} />
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'review' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Icon name="heart" size={22} className="text-sky-500" /> 소감</h2>
                  <button onClick={() => setModalState({ type: 'add_review' })} className="px-3 py-2 bg-sky-500 text-white text-xs font-bold rounded-xl">남기기</button>
                </div>
                <div className="space-y-3">
                  {reviews.map((r) => (
                    <div key={r.id} className="bg-white rounded-2xl p-5 border shadow-sm space-y-3">
                      <div className="flex justify-between">
                        <div className="flex space-x-2">
                          <div className="w-8 h-8 rounded-full bg-sky-100 text-sky-600 font-bold flex items-center justify-center text-xs">{r.author.slice(0, 1)}</div>
                          <div><p className="text-xs font-bold text-slate-800">{r.author}</p><p className="text-[10px] text-slate-400">{new Date(r.createdAt).toLocaleDateString()}</p></div>
                        </div>
                        {(user.isAdmin || user.name === r.author) && (
                          <div className="flex space-x-1">
                            <button onClick={() => setModalState({ type: 'edit_review', data: r })} className="text-slate-300 hover:text-sky-500 p-1"><Icon name="edit" size={16} /></button>
                            <button onClick={() => deleteReview(r.id)} className="text-slate-300 hover:text-rose-500 p-1"><Icon name="trash-2" size={16} /></button>
                          </div>
                        )}
                      </div>
                      <p className="text-sm text-slate-700 italic">"{renderTextWithLinks(r.content)}"</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {lightboxImg && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <div className="relative max-w-3xl w-full flex flex-col items-center">
                <button onClick={() => setLightboxImg(null)} className="absolute -top-12 right-0 text-white p-2"><Icon name="x" size={28} /></button>
                <img src={lightboxImg.originalUrl || lightboxImg.url} className="max-h-[75vh] w-auto rounded-xl" />
                <div className="mt-4 text-center text-white space-y-2">
                  <p>{renderTextWithLinks(lightboxImg.caption)}</p>
                  <button onClick={() => forceDownload(lightboxImg.originalUrl || lightboxImg.url, `training_photo_${Date.now()}.jpg`)} className="inline-flex items-center gap-1.5 px-4 py-2 bg-sky-500 text-white font-bold rounded-xl text-xs">
                    <Icon name="download" size={16} /> 사진 앱에 저장하기
                  </button>
                </div>
              </div>
            </div>
          )}

          {modalState.type && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-slate-800">등록하기</h3>
                  <button onClick={() => { setSelectedFiles([]); setModalState({ type: null }); }}><Icon name="x" size={20} /></button>
                </div>
                
                {modalState.type === 'upload_photo' ? (
                  <form onSubmit={(e) => { e.preventDefault(); uploadPhotos(selectedFiles, e.target.caption.value); }} className="space-y-3">
                    <input type="file" accept="image/*" multiple required onChange={(e) => setSelectedFiles(e.target.files)} className="w-full p-2 border rounded-xl text-sm" />
                    {selectedFiles.length > 0 && (
                      <div className="flex gap-2 overflow-x-auto py-2">
                        {Array.from(selectedFiles).map((file, idx) => (
                          <div key={idx} className="relative w-16 h-16 rounded-lg overflow-hidden border shrink-0 bg-slate-100">
                            <img src={URL.createObjectURL(file)} className="w-full h-full object-cover" />
                          </div>
                        ))}
                      </div>
                    )}
                    <input name="caption" placeholder="사진 캡션 (설명)" className="w-full p-3 border rounded-xl text-sm" />
                    {isUploading && <p className="text-xs text-sky-500 animate-pulse pt-2">선택한 사진들을 최적화하여 일괄 업로드 중이다...</p>}
                    <div className="flex space-x-2 pt-2">
                      <button type="button" onClick={() => { setSelectedFiles([]); setModalState({ type: null }); }} className="flex-1 py-3 bg-slate-100 font-bold rounded-xl text-xs">취소</button>
                      <button type="submit" disabled={isUploading} className="flex-1 py-3 bg-sky-500 text-white font-bold rounded-xl text-xs">확인</button>
                    </div>
                  </form>
                ) : (
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const val = e.target.content.value;
                    if(modalState.type === 'add_board') db.collection('boards').add({ content: val, author: user.name, createdAt: new Date().toISOString(), comments:[] });
                    if(modalState.type === 'add_review') db.collection('reviews').add({ content: val, author: user.name, createdAt: new Date().toISOString() });
                    setModalState({ type: null });
                  }} className="space-y-3">
                    <textarea name="content" placeholder="내용을 작성하라..." required rows={4} className="w-full p-3 border rounded-xl text-sm" />
                    <div className="flex space-x-2 pt-2">
                      <button type="button" onClick={() => setModalState({ type: null })} className="flex-1 py-3 bg-slate-100 font-bold rounded-xl text-xs">취소</button>
                      <button type="submit" className="flex-1 py-3 bg-sky-500 text-white font-bold rounded-xl text-xs">확인</button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          <nav className="fixed bottom-0 inset-x-0 bg-white/95 border-t z-40 px-2 py-2">
            <div className="max-w-md mx-auto grid grid-cols-5 gap-1 text-center">
              {[{ id: 'schedule', icon: 'calendar', l:'일정' }, { id: 'notice', icon: 'bell', l:'정보' }, { id: 'board', icon: 'message-square', l:'게시판' }, { id: 'gallery', icon: 'image', l:'사진' }, { id: 'review', icon: 'heart', l:'소감' }].map(t => (
                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-col items-center py-1.5 px-1 rounded-xl ${activeTab === t.id ? 'text-sky-600 bg-sky-50' : 'text-slate-400'}`}>
                  <Icon name={t.icon} size={18} /><span className="text-[10px] mt-1">{t.l}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<GlobalTrainingApp />);
  </script>
</body>
</html>
